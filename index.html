<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>R2 Energy · Energia solar de alta performance</title>
  <meta name="description" content="Energia solar com engenharia própria em Fortaleza. Peça seu orçamento pelo WhatsApp em segundos.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- Prévia do link no WhatsApp, Instagram e Facebook.
       Fica no HTML (e não no content.js) porque esses robôs não rodam JavaScript. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://r2energy.netlify.app/">
  <meta property="og:title" content="R2 Energy · Energia solar de alta performance">
  <meta property="og:description" content="Engenharia própria, instalação com precisão e monitoramento em tempo real. Peça seu orçamento pelo WhatsApp.">
  <meta property="og:image" content="https://r2energy.netlify.app/assets/hero/hero-poster.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/marca/r2-icone.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/marca/r2-icone-512.png">
  <link rel="apple-touch-icon" href="assets/marca/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

  <!-- ================= CABEÇALHO ================= -->
  <header class="header" id="header">
    <a class="logo" href="#top" aria-label="R2 Energy — início">
      <img src="assets/marca/r2-logo.svg" alt="R2 Energy" width="121" height="28">
    </a>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <a class="btn btn-primary btn-sm" id="btnHeaderWhats" href="#" target="_blank" rel="noopener"></a>
  </header>

  <main id="main">
    <!-- ================= ABERTURA ================= -->
    <section class="hero" id="top">
      <!-- vídeo de fundo (montado pelo app.js a partir do content.js) -->
      <div class="hero-video" id="heroVideo" aria-hidden="true"></div>
      <div class="hero-inner">
        <span class="eyebrow" id="heroTag"></span>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-actions" id="heroActions">
          <a class="btn btn-primary btn-lg" id="btnHeroWhats" href="#" target="_blank" rel="noopener"></a>
          <button class="btn btn-glass btn-lg" id="btnSimHero" type="button"></button>
        </div>
        <ul class="hero-stats" id="heroNumbers"></ul>
      </div>
    </section>

    <!-- ================= ORÇAMENTO EM 1 TOQUE ================= -->
    <section class="rapido" id="orcamento">
      <div class="wrap">
        <div class="rapido-card">
          <span class="tag" id="rapidoTag"></span>
          <h2 class="rapido-titulo" id="rapidoTitulo"></h2>
          <p class="rapido-sub" id="rapidoSub"></p>
          <div class="faixas" id="rapidoFaixas"></div>
          <button class="link-btn" id="rapidoSim" type="button"></button>
        </div>
      </div>
    </section>

    <!-- ================= RESIDENCIAL (gerada pelo app.js) ================= -->
    <div id="jornadas"></div>

    <!-- ================= RESULTADOS ================= -->
    <section class="prova" id="prova">
      <div class="wrap">
        <span class="tag" id="provaTag"></span>
        <h2 class="sec-titulo" id="provaTitulo"></h2>
        <ul class="numeros" id="provaNumeros"></ul>
        <div class="selos" id="provaSelos"></div>
        <div class="depoimentos" id="provaDepo"></div>
      </div>
    </section>

    <!-- ================= COMO FUNCIONA ================= -->
    <section class="processo" id="processo">
      <div class="wrap">
        <span class="tag" id="procTag"></span>
        <h2 class="sec-titulo" id="procTitulo"></h2>
        <ol class="passos" id="procPassos"></ol>
      </div>
    </section>

    <!-- ================= DÚVIDAS ================= -->
    <section class="faq" id="faq">
      <div class="wrap wrap-estreito">
        <span class="tag" id="faqTag"></span>
        <h2 class="sec-titulo" id="faqTitulo"></h2>
        <div class="faq-lista" id="faqLista"></div>
      </div>
    </section>

    <!-- ================= CHAMADA FINAL ================= -->
    <section class="contato" id="contato">
      <div class="contato-inner">
        <span class="eyebrow" id="contatoTag"></span>
        <h2 id="contatoTitulo"></h2>
        <p id="contatoTexto"></p>
        <div class="contato-actions">
          <a class="btn btn-white btn-lg" id="btnWhatsContato" href="#" target="_blank" rel="noopener"></a>
          <button class="btn btn-glass btn-lg" id="btnSimContato" type="button"></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <img class="footer-logo" src="assets/marca/r2-logo.svg" alt="R2 Energy" width="104" height="24" loading="lazy">
        <p class="footer-desc" id="footerDesc"></p>
      </div>
      <div class="footer-col">
        <span class="footer-label">Contato</span>
        <a id="footerFone" href="#"></a>
        <a id="footerMail" href="#"></a>
        <span id="footerEnd"></span>
      </div>
      <div class="footer-col">
        <span class="footer-label">Empresa</span>
        <span>CNPJ <strong id="footerCnpj"></strong></span>
        <span id="footerCred"></span>
      </div>
    </div>
  </footer>

  <!-- ================= BARRA FIXA (só no celular) ================= -->
  <div class="barra" id="barraFixa" aria-hidden="true">
    <div class="barra-texto">
      <strong id="barraTitulo"></strong>
      <span id="barraTexto"></span>
    </div>
    <a class="btn btn-primary btn-sm" id="barraBtn" href="#" target="_blank" rel="noopener" tabindex="-1"></a>
  </div>

  <!-- ================= SIMULADOR ================= -->
  <dialog class="modal" id="simModal" aria-labelledby="simTitulo">
    <div class="modal-box">
      <button class="modal-close" id="simClose" type="button" aria-label="Fechar simulador">×</button>

      <!-- Passo 1: entrada -->
      <div class="sim-step" id="simStepInput">
        <div class="modal-placa" aria-hidden="true"><img src="assets/residencial/ceu.jpg" alt=""></div>
        <span class="tag">Simulador</span>
        <h2 id="simTitulo"></h2>
        <p class="muted" id="simSub"></p>

        <div class="seg" role="radiogroup" aria-label="Tipo de entrada">
          <button class="seg-btn is-active" type="button" data-modo="reais" role="radio" aria-checked="true">Valor da conta (R$)</button>
          <button class="seg-btn" type="button" data-modo="kwh" role="radio" aria-checked="false">Consumo (kWh/mês)</button>
        </div>

        <label class="field">
          <span id="simLabel">Valor médio da conta de energia</span>
          <div class="input-wrap">
            <span class="input-prefix" id="simPrefix">R$</span>
            <input type="number" id="simValor" min="1" step="1" placeholder="Ex.: 450" inputmode="decimal">
          </div>
          <small class="muted" id="simDica">Use a média dos últimos 12 meses para um resultado mais preciso.</small>
        </label>

        <div class="loc-box" id="locBox">
          <span class="loc-dot" aria-hidden="true"></span>
          <span id="locTexto">Detectando sua localização…</span>
        </div>

        <button class="btn btn-primary btn-lg btn-block" id="simCalcular" type="button">Calcular meu sistema</button>
      </div>

      <!-- Passo 2: resultado -->
      <div class="sim-step is-hidden" id="simStepResult">
        <span class="tag">Resultado da simulação</span>
        <h2>Seu sistema recomendado</h2>
        <p class="muted" id="resResumo"></p>

        <div class="cards" id="resCards"></div>

        <div class="nota" id="resNota"></div>

        <a class="btn btn-primary btn-lg btn-block" id="resWhats" href="#" target="_blank" rel="noopener"></a>
        <button class="btn btn-ghost btn-block" id="resRefazer" type="button">Refazer simulação</button>
      </div>
    </div>
  </dialog>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
